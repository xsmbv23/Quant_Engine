name: worker-runtime-guard

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lineage guard tests
        run: python -m pytest -q test_worker_runtime_guard.py
