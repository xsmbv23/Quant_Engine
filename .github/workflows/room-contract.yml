name: Room Contract

on:
  push:
  pull_request:

jobs:
  room-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded room contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
