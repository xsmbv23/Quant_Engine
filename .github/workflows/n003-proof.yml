name: N003 Forensic Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  n003-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run foundation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run N003 proof
        run: python tools/n003_proof_runner.py
