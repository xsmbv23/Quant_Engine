name: Quant Engine Layer 1 Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/admission_check.yml'
      - 'state/**'

jobs:
  verify-layer-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source contracts
        run: python tools/verify_source_contracts.py

      - name: Verify semantic parser contracts
        run: python tools/verify_parser_contracts.py

      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate workflow execution receipt
        id: generate_receipt
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_ID="${{ github.run_id }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          COMMIT_SHA="${{ github.sha }}"
          WORKFLOW="${{ github.workflow }}"
          WORKFLOW_REF="${{ github.workflow_ref }}"
          WORKFLOW_SHA="${{ github.workflow_sha }}"
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          TREE_HASH=$(git rev-parse HEAD^{tree})
          SOURCE_HASH=$(git ls-files -z contracts tools tests state .github/workflows/admission_check.yml | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          cat <<EOF > artifacts/receipt.json
          {
            "event_type": "REAL_GITHUB_WORKFLOW_EXECUTION",
            "execution_status": "PASS",
            "repository": "$REPO",
            "workflow": "$WORKFLOW",
            "workflow_ref": "$WORKFLOW_REF",
            "workflow_sha": "$WORKFLOW_SHA",
            "event_name": "$EVENT_NAME",
            "ref": "$REF",
            "actor": "$ACTOR",
            "run_id": "$RUN_ID",
            "run_attempt": "$RUN_ATTEMPT",
            "commit_sha": "$COMMIT_SHA",
            "tree_hash": "$TREE_HASH",
            "source_set_sha256": "$SOURCE_HASH",
            "timestamp": "$TIMESTAMP",
            "evidence_kind": "REPOSITORY_VERIFIER_EXECUTION",
            "external_runtime_truth": "NOT_PROVEN",
            "layer": "LAYER_1_ROOM_01",
            "promotion": "DENY",
            "pass_inheritance": false,
            "unknown_is_not_pass": true
          }
          EOF
          cat artifacts/receipt.json

      - name: Verify receipt semantic boundary
        run: |
          python - <<'PY'
          import json
          from tools.verify_workflow_receipt_contract import validate_receipt
          with open("artifacts/receipt.json", encoding="utf-8") as f:
              validate_receipt(json.load(f))
          print("workflow receipt contract: PASS")
          PY

      - name: Upload workflow execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: workflow-execution-receipt
          path: artifacts/receipt.json
